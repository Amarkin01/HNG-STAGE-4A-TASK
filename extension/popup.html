<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            width: 320px;
            padding: 15px;
            font-family: 'Segoe UI', sans-serif;
            background: #f4f7f6;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        h3 {
            margin: 0;
            color: #333;
            font-size: 18px;
        }

        button {
            padding: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled {
            background: #94a3b8;
        }

        #status {
            font-size: 12px;
            color: #666;
            height: 15px;
        }

        #summary {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-size: 13px;
            line-height: 1.5;
            color: #444;
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .loading {
            font-style: italic;
            color: #2563eb;
        }
    </style>
</head>

<body>
    <div class="container">
        <h3>AI Summarizer</h3>
        <button id="summarizeBtn">Summarize Page</button>
        <button id="clearBtn" style="background: #dc2626;">Clear Summary</button>
        <div id="status"></div>
        <div id="summary">Your summary will appear here...</div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
